<style>.art{pointer-events:auto;cursor:pointer}.gallery{position:absolute;inset:0;z-index:30;background:#090909df;display:flex;justify-content:center;align-items:center;padding:16px}.gallery-card{position:relative;width:min(100%,470px);height:min(88%,760px);background:#191919;color:white;border-radius:16px;overflow:hidden;box-shadow:0 18px 70px #0009}.gallery-head{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:linear-gradient(#000c,transparent);font-size:13px}.gallery-close{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#0009;color:white;font-size:24px}.gallery-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;touch-action:pan-y}.gallery-slide{position:relative;height:100%;min-height:100%;scroll-snap-align:start;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,var(--bg1),var(--bg2))}.gallery-slide:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#000b);pointer-events:none}.gallery-object{height:62%;width:65%;display:flex;justify-content:center;align-items:center;filter:drop-shadow(12px 20px 18px #0006)}.gallery-object svg{height:100%;max-width:100%}.gallery-object.angle-left{transform:perspective(900px) rotateY(30deg) rotate(-5deg)}.gallery-object.angle-right{transform:perspective(900px) rotateY(-30deg) rotate(5deg)}.gallery-object.detail{height:95%;transform:scale(1.4) translateY(20%)}.gallery-scene{background:linear-gradient(125deg,#d9d4c9,#8d897f)}.gallery-scene:before{content:"";position:absolute;width:130%;height:45%;background:#e5e0d7;transform:rotate(-12deg);bottom:-10%;box-shadow:0 -8px 25px #0002}.gallery-scene .gallery-object{transform:rotate(-18deg);height:56%}.gallery-caption{position:absolute;bottom:27px;left:22px;z-index:1}.gallery-caption strong{display:block;font-size:22px}.gallery-caption small{display:block;font-size:11px;margin-top:8px;color:#e8e8e8}.gallery-indicator{position:absolute;right:20px;bottom:32px;z-index:1;font-size:11px;color:white}.gallery-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff9;font-size:10px;z-index:2;pointer-events:none;white-space:nowrap}@media(max-width:760px){.gallery{padding:0;align-items:end}.gallery-card{width:100%;height:90%;border-radius:18px 18px 0 0}}</style>
<link rel="stylesheet" href="discovery.css">
<script>
const products=[
{id:'bloom',title:'Blooming Hours',cn:'A little spring in your hand.',creator:'Luna Design',handle:'luna.design',initial:'LD',pattern:'flower',colors:['#b6c9dd','#687b54'],base:'#e7e6d3',ink:'#7486c1',tags:['Florals','Soft blue','Original design'],story:'Inspired by wildflowers and a soft afternoon sky.'},
{id:'marble',title:'Moss in Motion',cn:'Slow down and enjoy the everyday.',creator:'Studio Kai',handle:'studio.kai',initial:'SK',pattern:'marble',colors:['#899977','#333f2e'],base:'#7c8b54',ink:'#d3d3a0',tags:['Fluid textures','Moss green','Nature'],story:'Moss, stone, and water inspire a slower rhythm.'},
{id:'check',title:'Off the Grid',cn:'Find beauty beyond the rules.',creator:'Mori Studio',handle:'mori.studio',initial:'MS',pattern:'check',colors:['#c0b3a0','#6e665d'],base:'#e4e1d4',ink:'#292e29',tags:['Checkerboard','Monochrome','Freeform'],story:'A playful twist on a classic checkerboard.'},
{id:'cloud',title:'Cloud Journey',cn:'A clear-sky kind of day.',creator:'Luna Design',handle:'luna.design',initial:'LD',pattern:'cloud',colors:['#a5c2d9','#537997'],base:'#85b4d7',ink:'#f2f0e4',tags:['Sky collection','Airy','Daydream'],story:'Carry a piece of the sky wherever you go.'},
{id:'daisy',title:'Daisy Days',cn:'Little flowers, brighter days.',creator:'Mori Studio',handle:'mori.studio',initial:'MS',pattern:'flower',colors:['#c2c89b','#5b7144'],base:'#8d9d68',ink:'#f5f0d6',tags:['Daisies','Garden','Everyday nature'],story:'A little garden joy for every day.'},
{id:'sunset',title:'Peach Reverie',cn:'A little warmth after sunset.',creator:'Studio Kai',handle:'studio.kai',initial:'SK',pattern:'marble',colors:['#e2bda9','#a77c79'],base:'#d592ad',ink:'#efd6ac',tags:['Sunset pink','Flowing colors','Soft tones'],story:'A love letter to warm sunsets.'}];
const plans=[{id:'week',name:'Weekly',price:12,unit:'week',interval:'Every week',days:7},{id:'month',name:'Monthly',price:39,unit:'month',interval:'Every month',months:1},{id:'quarter',name:'Quarterly',price:109,unit:'quarter',interval:'Every 3 months',months:3}];
let saved={};try{saved=JSON.parse(localStorage.getItem('zozo-demo-v1')||'{}')||{}}catch{};
let state={index:0,wishes:Array.isArray(saved.wishes)?saved.wishes.filter(x=>products.some(p=>p.id===x)):[],following:Array.isArray(saved.following)?saved.following:[],subscription:saved.subscription||null,plan:'month',model:'iPhone 16 Pro',choice:null,view:'feed',filter:'all',period:0,skipped:[]};
let artSequence=0;
const $=s=>document.querySelector(s),current=()=>products[state.index],plan=()=>plans.find(p=>p.id===state.plan),panel=$('#panel');
function persist(){try{localStorage.setItem('zozo-demo-v1',JSON.stringify({wishes:state.wishes,following:state.following,subscription:state.subscription}))}catch{toast('Your browser could not save changes for later.')}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2000)}
function art(p){const artId=++artSequence;let shapes='';if(p.pattern==='flower'){for(let i=0;i<17;i++){let x=25+(i*67)%175,y=40+(i*91)%370;shapes+=`<g transform="translate(${x} ${y}) rotate(${i*29})">${Array.from({length:5},(_,k)=>`<ellipse rx="10" ry="22" cy="-17" fill="${p.ink}" opacity=".85" transform="rotate(${k*72})"/>`).join('')}<circle r="6" fill="#e3bf77"/></g>`}}if(p.pattern==='marble'){for(let i=0;i<17;i++)shapes+=`<path d="M${i*23-180} -20 C ${i*13+270} 140, ${i*11-150} 230, ${i*24+20} 450" fill="none" stroke="${i%3===0?'#f7f1ce':p.ink}" opacity="${i%2?.6:.3}" stroke-width="${i%3===0?4:15}"/>`}if(p.pattern==='check'){for(let y=0;y<10;y++)for(let x=0;x<6;x++)if((x+y)%2===0)shapes+=`<path d="M${x*44-15} ${y*48-10} q22 -12 44 0 l-5 48 q-20 12 -44 0Z" fill="${p.ink}"/>`}if(p.pattern==='cloud'){for(let i=0;i<14;i++){let x=(i*83)%240,y=70+(i*77)%350;shapes+=`<g fill="${p.ink}" opacity=".85" transform="translate(${x} ${y})"><ellipse rx="42" ry="14"/><circle cy="-10" r="19"/><circle cx="20" cy="-8" r="15"/></g>`}}return `<svg viewBox="0 0 240 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${p.title} case design illustration"><defs><clipPath id="clip-${artId}"><rect x="10" y="7" width="220" height="433" rx="43"/></clipPath><linearGradient id="edge-${artId}"><stop stop-color="#f5f2d8"/><stop offset=".45" stop-color="#999c88"/><stop offset="1" stop-color="#ece8d1"/></linearGradient></defs><rect x="5" y="3" width="230" height="442" rx="47" fill="url(#edge-${artId})" stroke="#2c3629" stroke-width="2"/><g clip-path="url(#clip-${artId})"><path d="M0 0h240v450H0z" fill="${p.base}"/>${shapes}<path d="M15 8 Q25 0 218 10" stroke="white" stroke-width="5" opacity=".6" fill="none"/><path d="M224 50V400" stroke="white" opacity=".25" stroke-width="4"/></g><rect x="20" y="18" width="103" height="116" rx="28" fill="${p.base}" stroke="#eee4cd" stroke-width="3"/>${[[47,46],[95,77],[47,104]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="21" fill="#b9b5a0" stroke="#e3decd" stroke-width="2"/><circle cx="${x}" cy="${y}" r="16" fill="#18201e"/><circle cx="${x}" cy="${y}" r="10" fill="#101a22"/><circle cx="${x-5}" cy="${y-6}" r="4" fill="#8ca5ad" opacity=".65"/>`).join('')}<circle cx="96" cy="39" r="7" fill="#efe2b7"/><circle cx="95" cy="113" r="5" fill="#41473b"/><text x="120" y="414" text-anchor="middle" font-family="sans-serif" font-size="8" letter-spacing="3" fill="#fff" opacity=".8">ZOZO LAB</text></svg>`}
function style(p){return `--bg1:${p.colors[0]};--bg2:${p.colors[1]}`}
function updateNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(state.view==='feed'?'feed':state.view==='wishlist'?'wishlist':['plans','select','review','success','subscription'].includes(state.view)?'subscription':'account')));document.querySelectorAll('.desktop-sidebar [data-nav="feed"]').forEach(b=>b.classList.toggle('active',state.view==='feed'&&state.filter==='all'));document.querySelectorAll('.desktop-sidebar [data-filter="following"]').forEach(b=>b.classList.toggle('active',state.view==='feed'&&state.filter==='following'));$('#wish-count').textContent=state.wishes.length||''}
function icon(name, extra=''){
  return `<svg class="discovery-icon ${extra}" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><use href="../assets/icons/coolicons.svg#${name}"></use></svg>`;
}
function renderFeed(){
  cancelTap();
  const p=current(), liked=state.wishes.includes(p.id);
  const feed=$('#feed');
  const focusAction=feed.contains(document.activeElement)?document.activeElement.dataset.action:null;
  feed.style.cssText=style(p);
  feed.innerHTML=`<header class="phone-head">
    <a class="wordmark" href="../" aria-label="Back to ZOZO Lab Store"><img class="brand-mark" src="logo-white.svg" width="680" height="172" alt="ZOZO Lab"></a>
    <span class="demo-label">Studio preview</span>
  </header>
  <div class="feed-top">
    <div class="tabs" aria-label="Recommendations">
      <button data-filter="all" class="${state.filter==='all'?'active':''}" aria-pressed="${state.filter==='all'}">For you</button>
      <button data-filter="following" class="${state.filter==='following'?'active':''}" aria-pressed="${state.filter==='following'}">Following</button>
    </div>
    <div class="feed-position"><button class="mobile-step" data-action="previous" aria-label="Previous design">${icon('arrow-up')}</button><span class="counter">${String(eligible().indexOf(state.index)+1).padStart(2,'0')} / ${String(eligible().length).padStart(2,'0')}</span><button class="mobile-step" data-action="next" aria-label="Next design">${icon('arrow-up','icon-down')}</button></div>
  </div>
  <button class="art" data-action="openGallery" aria-label="View ${p.title} gallery" aria-haspopup="dialog">${art(p)}</button>
  <div class="product-copy" aria-live="polite">
    <button class="creator-link" data-action="creator">${p.creator} ${icon('arrow-up-right')}</button>
    <h2>${p.title}</h2><p>${p.cn}</p>
  </div>
  <div class="side-actions" aria-label="Design actions">
    <button data-action="creator" aria-label="View creator profile">Creator ${icon('arrow-up-right')}</button>
    <button data-action="like" aria-label="Save design" aria-pressed="${liked}">${liked?'Saved':'Save'}</button>
    <button data-action="skip" aria-label="Skip this design">Skip ${icon('arrow-right')}</button>
  </div>
  <button class="choose" data-action="openGallery" aria-haspopup="dialog"><span>View gallery</span>${icon('arrow-up-right')}</button>`;
  if(focusAction) feed.querySelector(`[data-action="${focusAction}"]`)?.focus({preventScroll:true});
  updateNav();
}
function show(view,html){cancelTap();state.view=view;$('#feed').inert=true;panel.innerHTML=html;panel.classList.remove('hidden');panel.scrollTop=0;updateNav();panel.querySelector('.panel-head button')?.focus({preventScroll:true})}
const head=(title,back='home')=>`<div class="panel-head"><button data-action="${back}" aria-label="Back">${icon('arrow-left')}</button><strong>${title}</strong><span class="badge">Concept demo</span></div>`;
function home(){state.view='feed';$('#feed').inert=false;panel.classList.add('hidden');renderFeed();$('#feed').focus({preventScroll:true})}
function eligible(){return products.map((p,i)=>i).filter(i=>state.filter!=='following'||state.following.includes(products[i].creator))}
function move(delta){if(state.view!=='feed')return;const ids=eligible();if(!ids.length){toast('Follow a creator to see their work here.');return}let pos=ids.indexOf(state.index);state.index=ids[(pos+delta+ids.length)%ids.length];renderFeed()}
function like(force=false){const id=current().id,has=state.wishes.includes(id);if(force&&has){burst();return}state.wishes=has?state.wishes.filter(x=>x!==id):[...state.wishes,id];persist();renderFeed();if(!has)burst();toast(has?'Removed from wishlist':'Saved to wishlist')}
function burst(){let el=document.createElement('div');el.className='burst';el.setAttribute('aria-hidden','true');el.textContent='Saved';$('#feed').append(el);setTimeout(()=>el.remove(),700)}
function skip(){state.skipped.push(current().id);move(1);toast('Skipped · discovering another design')}
function tiles(list){return `<div class="grid">${list.map(p=>`<button class="tile" data-product="${p.id}"><div class="thumb" style="${style(p)}">${art(p)}</div><strong>${p.title}</strong><small>@${p.handle}</small></button>`).join('')}</div>`}
function creator(){const p=current(),works=products.filter(x=>x.creator===p.creator),followed=state.following.includes(p.creator);show('creator',`<div class="creator-banner"></div>${head('Creator profile')}<div class="flex"><div class="avatar profile-avatar">${p.initial}</div><button class="follow" data-action="follow">${followed?'Following ✓':'+ Follow'}</button></div><h2>${p.creator}</h2><p>@${p.handle} · Independent design studio</p><p>${p.story}</p><div class="statrow"><div><strong>${works.length}</strong><small>Sample designs</small></div><div><strong>Original</strong><small>Creative approach</small></div><div><strong>22%</strong><small>Example share</small></div></div><div class="section-label">All designs</div>${tiles(works)}<button class="secondary" data-action="earnings">Creator earnings ${icon('arrow-right')}</button><button class="secondary" data-action="choose">Try this case in the plan demo ${icon('arrow-right')}</button><p class="footer-note">Creators and designs shown are examples.</p>`)}
function wishlist(){let list=products.filter(p=>state.wishes.includes(p.id));show('wishlist',head('My wishlist')+`<h2>Save what inspires you.</h2><p>${list.length} saved designs · Select a design to continue</p>`+(list.length?tiles(list):`<div class="empty"><h2>No saved designs yet.</h2><p>Double-tap a design to save it here.</p><button class="primary" data-action="home">Explore designs ${icon('arrow-right')}</button></div>`))}
function choose(){state.choice=current().id;if(state.subscription){state.model=state.subscription.model;selectProduct()}else showPlans()}
function showPlans(){show('plans',head('Choose your rhythm')+`<div class="eyebrow">YOUR STYLE, YOUR RHYTHM</div><h2>A fresh look,<br>on your schedule.</h2><p>Choose one case yourself each cycle.<br>We wait for your choice; no automatic selection.</p><div class="plans">${plans.map(p=>`<button class="plan ${state.plan===p.id?'selected':''}" data-plan="${p.id}" aria-pressed="${state.plan===p.id}"><span><strong>${p.name} ${state.plan===p.id?'●':'○'}</strong><small>${p.interval} · choose 1 case</small></span><span class="price">$${p.price}<small> / ${p.unit}</small></span></button>`).join('')}</div><div class="notice" style="margin-top:16px">Example prices in USD. No payment, order, or charge is created. Shipping and tax terms are to be determined.</div><button class="primary" data-action="select">Next · Choose your design ${icon('arrow-right')}</button><p class="footer-note">Your choice / Made to order / Support creators</p>`)}
function chosen(){return products.find(p=>p.id===state.choice)||current()}
function selectProduct(){if(!state.choice)state.choice=current().id;const p=chosen();show('select',head('Choose design and phone',state.subscription?'subscription':'plans')+`<div class="hero-art" style="${style(p)}">${art(p)}</div><div class="flex"><h2 style="font-size:23px">${p.title}</h2><button data-action="toggle-choice-like" aria-label="Save selected design">${state.wishes.includes(p.id)?'Saved':'Save'}</button></div><p>@${p.handle} · ${p.cn}</p><div class="section-label">Phone model (examples)</div><select id="model" aria-label="Phone model">${['iPhone 16 Pro','iPhone 16','iPhone 15 Pro','iPhone 15','Samsung Galaxy S24'].map(m=>`<option ${m===state.model?'selected':''}>${m}</option>`).join('')}</select><div class="section-label">Choose another design</div>${tiles(products)}<button class="primary" data-action="review">${state.subscription?'Confirm this cycle’s choice':'Next · Review demo subscription'} ${icon('arrow-right')}</button>`)}
function review(){const p=chosen(),pl=state.subscription?plans.find(x=>x.id===state.subscription.plan):plan();show('review',head('Review demo subscription','select')+`<h2>${state.subscription?'Your choice for this cycle.':'Made for your taste.'}</h2><p>Review your design and phone model.</p><div class="hero-art" style="${style(p)};height:175px">${art(p)}</div><div class="row"><span>This cycle’s design</span><span>${p.title}<br>@${p.handle}</span></div><div class="row"><span>Phone model</span><span>${state.model}</span></div><div class="row"><span>Plan</span><span>${pl.name} · ${pl.interval} · 1 case</span></div><div class="row"><span>Example price per cycle</span><span>$${pl.price} USD</span></div><div class="row"><span>Actual charge today</span><strong>$0.00</strong></div><p>Your choice is saved in this browser. Future cycles await your selection. This demo creates no orders or deliveries.</p><label class="confirm-check"><input type="checkbox" id="consent">I understand this is a demo. I will not be charged and nothing will ship.</label><button class="primary" id="confirm" data-action="confirm" disabled>Confirm demo ${state.subscription?'selection':'subscription'} · $0 ${icon('arrow-right')}</button>`)}
function dateAt(iso){return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
function nextDate(pl,start){let d=new Date(start);if(pl.days)d.setDate(d.getDate()+pl.days);else{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+pl.months);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}return d.toISOString()}
function confirm(){if(!$('#consent')?.checked)return;const pl=state.subscription?plans.find(x=>x.id===state.subscription.plan):plan();const start=state.subscription?.start||new Date().toISOString();state.subscription={plan:pl.id,model:state.model,start,next:state.subscription?.next||nextDate(pl,start),choice:state.choice,history:state.subscription?.history||[]};persist();show('success',head('Demo confirmation')+`<div class="success">✓</div><h2 style="text-align:center">Your choice, your style.</h2><p style="text-align:center">${chosen().title} · ${state.model}<br>Demo selection saved locally</p><div class="notice">Actual charge $0 · No order · No delivery<br>Example next cycle: ${dateAt(state.subscription.next)}<br>Choose a new design when the next cycle begins.</div><button class="primary" data-action="subscription">View subscription ${icon('arrow-right')}</button><button class="secondary" data-action="home">Keep exploring</button>`)}
function subscription(){const s=state.subscription;if(!s){showPlans();return}const pl=plans.find(x=>x.id===s.plan),p=products.find(x=>x.id===s.choice);show('subscription',head('My subscription')+`<div class="eyebrow">MY STYLE MEMBERSHIP</div><h2>${pl.name}</h2><p>$${pl.price} / ${pl.unit} · Demo status</p><div class="notice">Example next cycle: ${dateAt(s.next)}<br>Choose one case each cycle. Your actual charge is $0.</div><div class="section-label">Current cycle · ${p?'Selected':'Awaiting your choice'}</div>${p?`<div class="hero-art" style="${style(p)}">${art(p)}</div><div class="row"><span>${p.title}</span><span>${s.model}</span></div>`:`<div class="empty"><p>Choose a design from the feed for this cycle.</p></div>`}<button class="primary" data-action="home">${p?'Change this cycle’s design':'Choose this cycle’s design'} ${icon('arrow-right')}</button><button class="secondary" data-action="next-period">Simulate next cycle</button>${s.history.length?`<p class="small">Completed  ${s.history.length}  demo cycles</p>`:''}<button class="secondary" data-action="cancel">End demo subscription</button><p class="footer-note">This demo never automatically creates orders or charges.</p>`)}
function earnings(){show('earnings',head('Creativity deserves rewards.')+`<h2>Give every idea<br>its due.</h2><p>Creators submit designs, customers choose, and cases are made to order.</p><div class="notice">Example based on $36 net sales per case. Actual shares and payment terms are to be determined.</div><div class="split"><i></i><i></i><i></i></div><div class="row"><span>Creator · 22%</span><strong>$7.92</strong></div><div class="row"><span>Production and fulfillment · 43%</span><strong>$15.48</strong></div><div class="row"><span>Platform operations · 35%</span><strong>$12.60</strong></div><div class="section-label">EXAMPLE PER-ORDER SHARE</div><p>Example only; there are no real creators or earnings in this demo.</p><button class="secondary" data-action="creator">View creator designs ${icon('arrow-right')}</button>`)}
function account(){show('account',head('My ZOZO')+`<h2>Your personal style space.</h2><p>Guest demo · Saved only in this browser</p><button class="secondary" data-action="wishlist">Wishlist · ${state.wishes.length}  designs ${icon('arrow-right')}</button><button class="secondary" data-action="subscription">My demo subscription ${icon('arrow-right')}</button><button class="secondary" data-action="earnings">Creator earnings ${icon('arrow-right')}</button><div class="section-label">Following ${state.following.length}  creators</div>${state.following.map(x=>`<div class="row"><span>${x}</span><span>Following ✓</span></div>`).join('')||'<p>Swipe left to visit a creator and follow them.</p>'}<div class="section-label">ABOUT THIS DEMO</div><div class="notice">6  sample designs / 3 sample creators<br>Products and subscriptions are simulated locally. No store, account, or payment service is connected.</div><button class="secondary" data-action="reset">Clear local demo data</button>`)}
function openGallery(){cancelTap();if(state.view!=='feed'||$('.gallery'))return;const p=current(),slides=[['Front view','A closer look at the design.',''],['Left angle','Illustrative angle.','angle-left'],['Right angle','Illustrative angle.','angle-right'],['Design detail','A closer view of the artwork.','detail'],['Everyday setting','Illustrative scene · sample artwork.','scene']];const trigger=document.activeElement;let el=document.createElement('dialog');el.className='gallery';el.setAttribute('aria-label',p.title+' image gallery');el.innerHTML=`<div class="gallery-card"><div class="gallery-head"><strong>${p.title} · Gallery</strong><button class="gallery-close" data-action="close-gallery" aria-label="Close gallery">${icon('close')}</button></div><div class="gallery-scroll">${slides.map(([title,caption,kind],i)=>`<section class="gallery-slide ${kind==='scene'?'gallery-scene':''}" style="${style(p)}"><div class="gallery-object ${kind}">${art(p)}</div><div class="gallery-caption"><strong>${title}</strong><small>${caption}</small></div><span class="gallery-indicator">${i+1} / ${slides.length}</span></section>`).join('')}</div><div class="gallery-hint">Swipe or scroll up to see more</div></div>`;el.addEventListener('click',e=>{if(e.target===el)closeGallery()});el.addEventListener('close',()=>{el.remove();(trigger?.isConnected&&trigger!==document.body?trigger:$('#feed')).focus({preventScroll:true})});document.body.append(el);el.showModal()}
function closeGallery(){$('.gallery')?.close()}
const actions={openGallery,previous:()=>move(-1),next:()=>move(1), 'close-gallery':closeGallery,home,creator,like:()=>like(),skip,choose,wishlist,plans:showPlans,select:selectProduct,review,confirm,subscription,earnings,account,follow(){const c=current().creator;state.following=state.following.includes(c)?state.following.filter(x=>x!==c):[...state.following,c];persist();creator()},'toggle-choice-like'(){let id=chosen().id;state.wishes=state.wishes.includes(id)?state.wishes.filter(x=>x!==id):[...state.wishes,id];persist();selectProduct()},'next-period'(){const s=state.subscription;if(!s.choice){toast('Choose a design for this cycle first');return}s.history.push({choice:s.choice,model:s.model,start:s.start});s.start=s.next;s.next=nextDate(plans.find(p=>p.id===s.plan),s.start);s.choice=null;state.choice=null;persist();subscription();toast('Next demo cycle started. Choose your design.')},cancel(){state.subscription=null;state.choice=null;persist();showPlans();toast('Demo subscription ended')},reset(){state.wishes=[];state.following=[];state.subscription=null;state.choice=null;state.filter='all';persist();account();toast('Local demo data cleared')}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action&&!(b.matches('.art')&&e.detail>0))actions[b.dataset.action]?.();if(b.dataset.nav){const n=b.dataset.nav;if(n==='feed')state.filter='all';({feed:home,wishlist,subscription,account})[n]()}if(b.dataset.plan){state.plan=b.dataset.plan;showPlans()}if(b.dataset.filter){if(b.dataset.filter==='following'&&!state.following.length){toast('Follow a creator to see your following feed');return}state.filter=b.dataset.filter;if(!eligible().includes(state.index))state.index=eligible()[0];home()}if(b.dataset.product){state.index=products.findIndex(p=>p.id===b.dataset.product);if(state.view==='select'){state.choice=current().id;selectProduct()}else home()}});
document.addEventListener('change',e=>{if(e.target.id==='model')state.model=e.target.value;if(e.target.id==='consent')$('#confirm').disabled=!e.target.checked});
let start=null,lastTap=0,lastWheel=0,singleTapTimer;
const feed=$('#feed');
function cancelTap(){clearTimeout(singleTapTimer);lastTap=0;}
feed.addEventListener('pointerdown',event=>{
  if(!event.isPrimary||event.button!==0||event.target.closest('a,button:not(.art)'))return;
  start={x:event.clientX,y:event.clientY,id:event.pointerId,onArt:!!event.target.closest('.art')};
  feed.setPointerCapture(event.pointerId);
});
feed.addEventListener('pointerup',event=>{
  if(start?.id!==event.pointerId)return;
  const dx=event.clientX-start.x, dy=event.clientY-start.y, onArt=start.onArt;
  start=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))>45){
    cancelTap();
    if(Math.abs(dx)>Math.abs(dy)) dx<0?creator():skip();
    else move(dy<0?1:-1);
    return;
  }
  if(!onArt){cancelTap();return;}
  if(performance.now()-lastTap<330&&lastTap){cancelTap();like(true);return;}
  lastTap=performance.now();
  singleTapTimer=setTimeout(openGallery,340);
});
feed.addEventListener('pointercancel',()=>{start=null;cancelTap();});
feed.addEventListener('wheel',event=>{
  event.preventDefault();
  if(Date.now()-lastWheel>500&&Math.abs(event.deltaY)>15){move(event.deltaY>0?1:-1);lastWheel=Date.now();}
},{passive:false});
document.addEventListener('keydown',event=>{
  if($('.gallery[open]'))return;
  if(event.key==='Escape'&&state.view!=='feed'){home();return;}
  if(state.view!=='feed'||!feed.contains(event.target)||event.target.closest('select,input'))return;
  const action={ArrowUp:()=>move(-1),ArrowDown:()=>move(1),ArrowLeft:creator,ArrowRight:skip}[event.key];
  if(action){event.preventDefault();action();}
});
$('#prev').innerHTML=icon('arrow-up');
$('#next').innerHTML=icon('arrow-up','icon-down');
$('#prev').onclick=()=>move(-1);
$('#next').onclick=()=>move(1);
renderFeed();
</script></body></html>
